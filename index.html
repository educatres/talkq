<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TalkQ 演講提問器｜建立留言板</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container project-title">
      <div class="logo">Q</div>
      <div><h1>TalkQ 演講提問器</h1></div>
    </div>
  </header>
  <main class="main">
    <div class="container grid">
      <section class="card intro-card">
        <h2>建立問題留言板</h2>
        <p>每個留言板建立後保留三天。聽眾不需註冊或登入，講師可即時審核並公開問題。</p>
      </section>
      <section class="card">
        <div id="notice" class="notice hidden"></div>
        <div class="grid grid-2">
          <div class="field">
            <label class="required" for="talkTitle">演講名稱</label>
            <input class="input" id="talkTitle" maxlength="100" placeholder="例如：AI 與未來教育">
          </div>
          <div class="field">
            <label class="required" for="talkId">演講 ID</label>
            <div class="button-row">
              <input class="input" id="talkId" style="flex:1" readonly>
              <button class="btn" id="newId" type="button">重新產生</button>
            </div>
          </div>
        </div>
        <div class="field">
          <label for="publishMode">新問題預設狀態</label>
          <select id="publishMode">
            <option value="moderated">講師審核後才公開</option>
            <option value="auto_public">投稿者同意時直接公開</option>
          </select>
        </div>
        <button class="btn btn-primary btn-large" id="generate" type="button">建立留言板並產生連結</button>
      </section>
      <section id="credentials" class="card hidden">
        <h2>講師管理資訊</h2>
        <p>六位數管理密鑰：<strong class="pin" id="moderatorKey"></strong></p>
        <p>資料到期時間：<strong id="expiresAt"></strong></p>
        <p class="danger-note">請只把「講師管理頁」網址交給講師；網址內含管理密鑰。</p>
      </section>
      <section id="outputs" class="links-grid hidden"></section>
    </div>
  </main>
  <button class="directory-trigger" id="directoryTrigger" type="button" aria-label="查看目前調查 ID" title="查看目前調查 ID">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M15.5 7.5a5.5 5.5 0 1 1-2.1 4.32L22 3.22V7h-3v3h-3v3h-2.22l-1.96-1.96A5.5 5.5 0 0 1 15.5 7.5ZM5 18.5A1.5 1.5 0 1 0 5 15.5a1.5 1.5 0 0 0 0 3Z"/>
    </svg>
  </button>
  <dialog class="talk-directory-dialog" id="talkDirectoryDialog">
    <div class="directory-heading">
      <div>
        <h2>目前調查 ID</h2>
        <p>僅顯示尚未到期的留言板。</p>
      </div>
      <button class="btn directory-close" id="directoryClose" type="button" aria-label="關閉">關閉</button>
    </div>
    <div class="sync-line" id="directoryStatus">正在讀取…</div>
    <ul class="directory-list" id="directoryList"></ul>
  </dialog>
  <footer class="footer">TalkQ｜Firebase Cloud Firestore｜資料保留三天</footer>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script type="module" src="js/setup.js"></script>
</body>
</html>
